<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaishak Suresh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #D9C9BA;
            --surface: #F5EFE8;
            --text: #1C1917;
            --muted: #7C6F64;
            --accent: #8B6F5E;
            --border: #C9B8A8;
            --tape: #3A3A3C;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 2rem;
        }

        .container {
            position: relative;
            max-width: 560px;
            width: 100%;
            padding: 3.5rem 3.5rem 3rem;
            background: var(--surface);
            transform: rotate(-1.2deg);
            box-shadow:
                1px 2px 2px rgba(0, 0, 0, 0.1),
                4px 8px 16px rgba(0, 0, 0, 0.18),
                8px 20px 48px rgba(0, 0, 0, 0.16);
        }

        /* Left tape strip */
        .container::before {
            content: '';
            position: absolute;
            width: 68px;
            height: 24px;
            top: -9px;
            left: 48px;
            transform: rotate(-40deg);
            background: linear-gradient(180deg, #4a4a4e 0%, #333336 100%);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        }

        /* Right tape strip */
        .container::after {
            content: '';
            position: absolute;
            width: 68px;
            height: 24px;
            top: -9px;
            right: 48px;
            transform: rotate(38deg);
            background: linear-gradient(180deg, #4a4a4e 0%, #333336 100%);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-family: 'Fredoka One', sans-serif;
            font-size: clamp(2.2rem, 6vw, 3.25rem);
            font-weight: 400;
            letter-spacing: -0.5px;
            line-height: 1.05;
            color: var(--text);
            margin-bottom: 1rem;
        }

        .tagline {
            font-size: 0.875rem;
            font-weight: 300;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 0.5rem;
        }

        .meta {
            display: flex;
            gap: 1.25rem;
            font-size: 0.775rem;
            font-weight: 400;
            color: var(--muted);
            margin-bottom: 2.5rem;
        }

        .meta span {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .meta span::before {
            content: '';
            display: inline-block;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--border);
        }

        .meta span:first-child::before {
            display: none;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin-bottom: 2.5rem;
        }

        .quote-container {
            min-height: 76px;
            display: flex;
            align-items: flex-start;
            margin-bottom: 2.5rem;
            font-size: 1rem;
            font-weight: 300;
            line-height: 1.75;
            font-style: italic;
            color: var(--muted);
        }

        .cursor {
            display: inline-block;
            width: 1.5px;
            height: 1.1em;
            background: var(--border);
            margin-left: 3px;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }

        .cursor.done {
            animation: none;
            opacity: 0;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .links {
            display: flex;
            gap: 1.75rem;
            font-size: 0.825rem;
            font-weight: 400;
        }

        a {
            color: var(--muted);
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s ease;
            padding-bottom: 1px;
            border-bottom: 1px solid transparent;
        }

        a:hover {
            color: var(--text);
            border-bottom-color: var(--accent);
        }

        a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
            border-radius: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            .cursor {
                animation: none;
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 3rem 2.25rem 2.5rem;
            }

            .meta {
                flex-direction: column;
                gap: 0.25rem;
            }

            .meta span::before {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Vaishak Suresh</h1>

        <p class="tagline">Living at the intersection of Engineering, Product and Herding Cats</p>

        <div class="meta">
            <span>Engineering @ Autodesk</span>
            <span>SF Bay Area · India</span>
        </div>

        <div class="divider"></div>

        <div class="quote-container">
            <span id="quote"></span><span class="cursor" id="cursor"></span>
        </div>

        <div class="links">
            <a href="https://linkedin.com/in/vaishaksuresh" target="_blank" rel="noopener">LinkedIn</a>
            <a href="https://github.com/vaishaksuresh" target="_blank" rel="noopener">GitHub</a>
            <a href="https://instagram.com/vaishaksuresh" target="_blank" rel="noopener">Instagram</a>
        </div>
    </div>

    <script>
        const quotes = [
            "The best way to predict the future is to invent it.",
            "Software is a tool for thought; infrastructure is the foundation.",
            "Simplicity is the ultimate sophistication.",
            "Build systems, not just software.",
            "Constraints drive creativity."
        ];

        function getRandomQuote() {
            return quotes[Math.floor(Math.random() * quotes.length)];
        }

        function typewriterEffect(element, cursorEl, text, speed = 42) {
            let index = 0;
            element.textContent = '';

            function type() {
                if (index < text.length) {
                    element.textContent += text.charAt(index);
                    index++;
                    setTimeout(type, speed);
                } else {
                    setTimeout(() => cursorEl.classList.add('done'), 800);
                }
            }

            type();
        }

        window.addEventListener('DOMContentLoaded', () => {
            const quoteEl = document.getElementById('quote');
            const cursorEl = document.getElementById('cursor');
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            const quote = getRandomQuote();

            if (prefersReducedMotion) {
                quoteEl.textContent = quote;
            } else {
                typewriterEffect(quoteEl, cursorEl, quote, 42);
            }
        });
    </script>
</body>
</html>
